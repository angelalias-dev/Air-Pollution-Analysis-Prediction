services:

  namenode:
    image: apache/hadoop:3.3.6
    container_name: airpollution-namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/data/name
      - ./hadoop-config:/opt/hadoop/etc/hadoop
    command: >
      bash -c "
      if [ ! -d /data/name/current ]; then
        hdfs namenode -format -force;
      fi &&
      hdfs namenode
      "
    networks:
      - airpollution

  datanode:
    image: apache/hadoop:3.3.6
    container_name: airpollution-datanode
    hostname: datanode
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/data/data
      - ./hadoop-config:/opt/hadoop/etc/hadoop
    command: hdfs datanode
    depends_on:
      - namenode
    networks:
      - airpollution

  spark-master:
    image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
    container_name: airpollution-spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./hadoop-config:/opt/spark/conf/hadoop
      - ../data:/data
    environment:
      - HADOOP_CONF_DIR=/opt/spark/conf/hadoop
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /dev/null
      "
    networks:
      - airpollution

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
    container_name: airpollution-spark-worker
    hostname: spark-worker
    ports:
      - "8081:8081"
    volumes:
      - ./hadoop-config:/opt/spark/conf/hadoop
      - ../data:/data
    environment:
      - HADOOP_CONF_DIR=/opt/spark/conf/hadoop
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /dev/null
      "
    depends_on:
      - spark-master
    networks:
      - airpollution

  backend:
    image: airpollution-backend:latest
    container_name: airpollution-backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
      - ./hadoop-config:/opt/spark/conf/hadoop
    environment:
      - HADOOP_CONF_DIR=/opt/spark/conf/hadoop
    depends_on:
      - namenode
      - datanode
      - spark-master
    networks:
      - airpollution
networks:
  airpollution:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
